name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Lint Playwright config and specs
        run: pnpm exec eslint --config apps/web/eslint.config.js --no-ignore playwright.config.ts tests/e2e/public-app.spec.ts
      - run: pnpm typecheck
      - name: Typecheck Playwright config and specs
        run: pnpm --dir apps/web exec tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types node ../../playwright.config.ts ../../tests/e2e/public-app.spec.ts
      - run: pnpm test
      - run: pnpm build
      - name: Build GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ANNLITE_PAGES=true pnpm --filter @annlite/web build
      - name: Remove custom-domain marker from project Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm apps/web/dist/CNAME
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Record Playwright and browser versions
        run: |
          pnpm exec playwright --version
          pnpm exec playwright install --list
      - name: Run browser E2E and accessibility suite
        run: pnpm test:e2e
      - name: Preserve Playwright report, screenshots, traces, and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  deploy-custom-domain:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.cloudflare.outputs.configured == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.cloudflare.outputs.configured == 'true'
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        if: steps.cloudflare.outputs.configured == 'true'
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: steps.cloudflare.outputs.configured == 'true'
      - run: pnpm --filter @annlite/web build
        if: steps.cloudflare.outputs.configured == 'true'
      - name: Deploy independent annlite.com site
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=annlite --branch=main
